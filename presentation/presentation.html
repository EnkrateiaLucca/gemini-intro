# What is Gemini
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">WHAT IS GEMINI</p>

- **Native multimodality** — One model, one call: text + image + video + audio

- **Long context** — 1M+ tokens — used as working memory, not storage

- **Tool-using by default** — Search grounding, code execution, URL context, function calling

- **Family of sizes** — Pro · Flash · Flash-Lite — pick by cost/latency/quality

# AI Studio at a glance

1. **Playground** — System instructions, model picker, parameters, tool toggles. Where you start.

# Logan Kilpatrick's prototyping tricks
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">POWER-USER MOVES</p>

**Clone-then-build**
Screenshot an existing UI · drop it in · type "clone this UI exactly" · iterate from the scaffold rather than from zero.

**Single-prompt design exploration**
"Add a widget so I can click through these styles: [5 options]"
Explore variants without spawning N sessions.

**Connect Drive early**
AI Studio sessions don't persist by default — connect to Google Drive or you'll lose your work.

# Unified multimodality
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">LESSON 01</p>

One model, one call. Video + audio + image processed jointly — not as a pipeline of single-modality tools.

<div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin: 16px 0;">
<strong>Demo prompt</strong><br>
"I just recorded a walkthrough on toggling smart features in Gmail. Watch the recording and turn it into a clean step-by-step checklist I can hand to a new hire."
</div>

**Use cases**
- Screen recording → SOP checklist
- User-interview video → "list every pause > 3s and what was on screen"
- Dense PDF → infographic via Nano Banana Pro

# Long context = working memory
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">LESSON 02</p>

The 1M+ window already existed. What changed is retrieval quality — ~60% better at deep needle-in-haystack reasoning.

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 24px 0;">

<p style="font-size: 15px; color: #5C5750; font-style: italic;">"Summarize these documents."</p>
<p style="font-size: 14px; color: #2A2825;">Generic summary. The model glances. Information sits in the window unused.</p>
</div>
<div style="background: #EEF5EC; padding: 16px; border: 2px solid #000000; border-radius: 0px;">
<h4 style="margin-top: 0; color: #000000;">Working memory (right)</h4>
<p style="font-size: 15px; color: #5C5750; font-style: italic;">"Find the three biggest discrepancies between management strategy in the earnings call and what the financial PDFs actually show."</p>
<p style="font-size: 14px; color: #2A2825;">Cross-source reasoning. The model connects evidence buried in different files.</p>
</div>
</div>

# Grounding
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">LESSON 03</p>

Workspace, Search, URL Context, your own data — turn scattered digital history into a single queryable knowledge base.

**Power combo: URL Context + Search grounding**

Search finds relevant URLs · URL Context reads them · lightweight RAG substitute with zero infra.

*(TDS: "another nail in RAG's coffin" for prototypes.)*

</div>

# Generative UI
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">LESSON 04</p>

Screen Spot Pro: 11.4% → 72.7%. Output format becomes the artifact — calculators, dashboards, quizzes. The surface designs around the task.

# Context engineering > prompt engineering
<p style="font-size: 0.7em; color: #5C5750; text-transform: uppercase; letter-spacing: 0.1em;">LESSON 05</p>

Gemini can guess your tone, format, and length. It can't guess your facts. Spend effort on context, not phrasing.

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 24px 0;">
<div style="background: #FBEAE7; padding: 16px; border: 2px solid #000000; border-radius: 0px;">

<p style="font-size: 14px; color: #5C5750; font-style: italic;">"Act as a punchy thought-leadership writer. Voice: confident but not arrogant. Use 2-3 short paragraphs..."</p>
<p style="font-size: 13px; color: #2A2825;">Adjective soup. Generic results.</p>
</div>
<div style="background: #EEF5EC; padding: 16px; border: 2px solid #000000; border-radius: 0px;">
<h4 style="margin-top: 0; color: #000000;">New style</h4>
<p style="font-size: 14px; color: #5C5750; font-style: italic;">"Here are 3 of my VP's previous LinkedIn posts. Based on these, rewrite this Q4 report as a LinkedIn post."</p>
<p style="font-size: 13px; color: #2A2825;">Ground-truth examples. Output sounds like the VP.</p>
</div>
</div>

Ask for critique, not approval. Adopt a critical persona for sharper feedback.
